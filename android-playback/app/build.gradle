plugins { id 'com.android.application' }
android {
    namespace 'com.guilhermeramalho.tvplayback'
    compileSdk 34
    defaultConfig { applicationId 'com.guilhermeramalho.tvplayback'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
